<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Husker Men's Basketball — Auto Schedule</title>

  <!-- Cache-bust CSS so signage players don't reuse old files -->
  <link rel="stylesheet" href="assets/styles.css?v=2026-11-11-tv2" />

  <!-- Disable caching aggressively -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body>
  <!-- Fixed 1920x1080 stage; app.js scales it to fit the screen -->
  <div id="stage">

  <!-- =============== NEXT / HERO =============== -->
  <div id="view-next" class="view hidden">
    <div class="bg" id="next-bg"></div>
    <div class="next-card">
      <div id="next-record" class="record"></div>
      <div class="faceoff">
        <div class="team">
          <div class="logo-wrap">
            <img id="ne-logo" class="logo" alt="Nebraska" />
            <span id="ne-rank" class="rank-badge hidden"></span>
          </div>
          <div class="team-name">Nebraska</div>
        </div>
        <div class="vs" id="divider">vs.</div>
        <div class="team">
          <div class="logo-wrap">
            <img id="opp-logo" class="logo" alt="Opponent" />
            <span id="opp-rank" class="rank-badge hidden"></span>
          </div>
          <div id="next-opponent" class="team-name"></div>
        </div>
      </div>
      <div class="next-meta">
        <div>
          <div id="next-datetime" class="detail"></div>
          <div id="next-venue" class="detail sub"></div>
        </div>
        <div id="next-tv"></div>
      </div>
    </div>
  </div>

  <!-- =============== SCHEDULE (2 columns, fills the stage) =============== -->
  <div id="view-all" class="view hidden">
    <div class="all-wrap"><!-- JS injects .cols here --></div>
  </div>

  </div><!-- /#stage -->

  <div id="debug" class="debug hidden"></div>

  <script>
    // UI defaults (can be overridden by URL params)
    window.UI = {
      theme: "classic-husker",
      rotateSeconds: 15,
      showDividerLiteral: true,
      showCityOnly: true,
      kenBurns: false
    };

    // Cache-bust data fetches
    window.DATA_URL     = "data/mbb_schedule_normalized.json?v=" + Date.now();
    window.MANIFEST_URL = "data/arena_manifest.json?v=" + Date.now();
  </script>

  <!-- Cache-bust JS -->
  <script src="assets/app.js?v=2026-11-11-tv2"></script>
</body>
</html>
